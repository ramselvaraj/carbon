[package]
name = "carbon"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = { version = "3.7.0", features = ["image-data", "wayland-data-control"] }
bytemuck = "1.25.2"
chrono = "0.4.45"
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts", "accesskit", "clipboard"] }
egui_extras = { version = "0.37.0", features = ["file", "image"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
notify = "8.2.0"
open = "5.4.4"
pollster = "1.0.1"
pulldown-cmark = "0.13.4"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
trash = "5.2.9"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }
